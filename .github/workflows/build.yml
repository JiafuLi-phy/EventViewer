name: Build Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without external actions
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" .

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libegl1 libgl1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyside6 matplotlib numpy strax pyinstaller

      - name: Build
        run: |
          pyinstaller EventViewer.spec --distpath dist --workpath /tmp/pyinstaller_linux

      - name: Package
        run: |
          mkdir -p release/XENONnT-EventViewer-linux
          cp dist/XENONnT-EventViewer release/XENONnT-EventViewer-linux/
          cp scripts/output/*.npz release/XENONnT-EventViewer-linux/ 2>/dev/null || true
          cp dali_probe/*.npz release/XENONnT-EventViewer-linux/ 2>/dev/null || true
          cp README.md release/XENONnT-EventViewer-linux/ 2>/dev/null || true
          tar -C release -czf release/XENONnT-EventViewer-linux.tar.gz XENONnT-EventViewer-linux

      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes || true
          for i in {1..12}; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 5
          done
          gh release upload "$GITHUB_REF_NAME" release/XENONnT-EventViewer-linux.tar.gz --clobber

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout without external actions
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" .

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyside6 matplotlib numpy strax pyinstaller

      - name: Build
        run: |
          pyinstaller EventViewer.spec --distpath dist --workpath "$RUNNER_TEMP/pyinstaller_win"

      - name: Package
        run: |
          mkdir -p release/XENONnT-EventViewer-windows
          cp dist/XENONnT-EventViewer.exe release/XENONnT-EventViewer-windows/
          cp scripts/output/*.npz release/XENONnT-EventViewer-windows/ 2>/dev/null || true
          cp dali_probe/*.npz release/XENONnT-EventViewer-windows/ 2>/dev/null || true
          python - <<'PY'
          import shutil
          shutil.make_archive(
              "release/XENONnT-EventViewer-windows",
              "zip",
              "release/XENONnT-EventViewer-windows",
          )
          PY

      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes || true
          for i in {1..12}; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 5
          done
          gh release upload "$GITHUB_REF_NAME" release/XENONnT-EventViewer-windows.zip --clobber

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout without external actions
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" .

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyside6 matplotlib numpy strax pyinstaller

      - name: Build
        run: |
          pyinstaller EventViewer.spec --distpath dist --workpath /tmp/pyinstaller_mac

      - name: Package
        run: |
          mkdir -p pkg/XENONnT-EventViewer-macos-arm64
          cp -R dist/XENONnT-EventViewer.app pkg/XENONnT-EventViewer-macos-arm64/
          cp scripts/output/*.npz pkg/XENONnT-EventViewer-macos-arm64/ 2>/dev/null || true
          cp dali_probe/*.npz pkg/XENONnT-EventViewer-macos-arm64/ 2>/dev/null || true
          cp README.md pkg/XENONnT-EventViewer-macos-arm64/ 2>/dev/null || true
          hdiutil create -volname "XENONnT-EventViewer" \
            -srcfolder pkg/XENONnT-EventViewer-macos-arm64 \
            -ov -format UDZO \
            pkg/XENONnT-EventViewer-macos-arm64.dmg

      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes || true
          for i in {1..12}; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 5
          done
          gh release upload "$GITHUB_REF_NAME" pkg/XENONnT-EventViewer-macos-arm64.dmg --clobber

  build-macos-x64:
    runs-on: macos-13
    steps:
      - name: Checkout without external actions
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" .

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyside6 matplotlib numpy strax pyinstaller

      - name: Build
        run: |
          pyinstaller EventViewer.spec --distpath dist --workpath /tmp/pyinstaller_mac

      - name: Package
        run: |
          mkdir -p pkg/XENONnT-EventViewer-macos-x64
          cp -R dist/XENONnT-EventViewer.app pkg/XENONnT-EventViewer-macos-x64/
          cp scripts/output/*.npz pkg/XENONnT-EventViewer-macos-x64/ 2>/dev/null || true
          cp dali_probe/*.npz pkg/XENONnT-EventViewer-macos-x64/ 2>/dev/null || true
          cp README.md pkg/XENONnT-EventViewer-macos-x64/ 2>/dev/null || true
          hdiutil create -volname "XENONnT-EventViewer" \
            -srcfolder pkg/XENONnT-EventViewer-macos-x64 \
            -ov -format UDZO \
            pkg/XENONnT-EventViewer-macos-x64.dmg

      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes || true
          for i in {1..12}; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 5
          done
          gh release upload "$GITHUB_REF_NAME" pkg/XENONnT-EventViewer-macos-x64.dmg --clobber
